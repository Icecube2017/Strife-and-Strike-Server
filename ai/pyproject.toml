[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sns-ai"
version = "0.3.0"
description = "Offline Strife-and-Strike Gymnasium environment"
requires-python = ">=3.12"
dependencies = ["gymnasium>=1.2,<2", "numpy>=2,<3", "psutil>=6.1,<8"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
benchmark = ["psutil>=6.1,<8"]
train = ["torch>=2.8,<3", "stable-baselines3==2.9.2", "sb3-contrib==2.9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
